<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kamaai 超管后台改版原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="review">
      <section class="preview-wrap">
        <div class="preview-toolbar">
          <div>
            <strong>左侧原型</strong>
            <span>桌面端 1440×900 · 演示数据 · 超管全量菜单</span>
          </div>
          <div class="preview-actions">
            <button type="button" class="ghost-btn" id="btn-loading">模拟加载</button>
            <button type="button" class="ghost-btn" id="btn-empty">模拟空态</button>
            <button type="button" class="ghost-btn" id="btn-error">模拟失败</button>
            <button type="button" class="ghost-btn" id="btn-reset">恢复默认</button>
          </div>
        </div>
        <div class="preview-stage">
          <div class="admin" id="admin-root" data-rule-id="R-001">
            <aside class="sidebar" data-rule-id="R-002">
              <div class="brand">
                <span class="brand-mark">K</span>
                <div>
                  <b>Kamaai Center</b>
                  <small>Super Admin</small>
                </div>
              </div>
              <nav class="nav" id="nav"></nav>
            </aside>
            <div class="admin-main">
              <header class="topbar">
                <div>
                  <div class="crumb" id="crumb">总览 / 控制台</div>
                  <h1 id="page-title">控制台</h1>
                </div>
                <div class="topbar-right">
                  <span class="demo-tag" data-rule-id="R-013">演示数据</span>
                  <span class="operator">运营商：全部</span>
                  <span class="avatar">WZ</span>
                </div>
              </header>
              <main class="content" id="content"></main>
            </div>
          </div>
        </div>
      </section>
      <aside class="rules" id="rules">
        <div class="rules-head">
          <h2>规则标注</h2>
          <p>点击编号可与左侧原型互跳</p>
        </div>
        <div class="rules-list" id="rules-list"></div>
      </aside>
    </div>

    <div class="drawer-mask hidden" id="drawer-mask">
      <aside class="drawer" id="drawer"></aside>
    </div>
    <div class="modal-mask hidden" id="modal-mask">
      <div class="modal" id="modal"></div>
    </div>
    <div class="toast hidden" id="toast"></div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
